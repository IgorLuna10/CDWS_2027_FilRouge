<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="TrekHub Logo">
  <defs>
    <!-- Dégradé Cyan Spatial / Primaire -->
    <linearGradient id="trek-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #48e5c2)" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Dégradé Or Commandement / Accent -->
    <linearGradient id="trek-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #ffb703)" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Filtre de luminescence / Glow Starfleet -->
    <filter id="trek-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Anneau orbital de distorsion (Warp Ring) -->
  <circle 
    cx="50" 
    cy="52" 
    r="36" 
    stroke="url(#trek-primary-grad)" 
    stroke-width="2" 
    stroke-dasharray="140 30" 
    stroke-linecap="round"
    opacity="0.35" 
  />
  <circle 
    cx="50" 
    cy="52" 
    r="36" 
    stroke="url(#trek-accent-grad)" 
    stroke-width="2" 
    stroke-dasharray="0 140 40 10" 
    stroke-linecap="round"
    opacity="0.5" 
  />

  <!-- Delta Starfleet - Aile gauche (Cyan / Sciences & Ingénierie) -->
  <path 
    d="M 50 10 
       C 44 28, 30 58, 16 84 
       C 28 78, 40 72, 48 70 
       C 44 56, 46 32, 50 10 Z" 
    fill="url(#trek-primary-grad)" 
    fill-opacity="0.18"
    stroke="url(#trek-primary-grad)" 
    stroke-width="3" 
    stroke-linejoin="round"
    filter="url(#trek-glow)"
  />

  <!-- Delta Starfleet - Aile droite (Or / Commandement & Propulsion) -->
  <path 
    d="M 50 10 
       C 56 28, 70 58, 84 84 
       C 72 78, 60 72, 52 70 
       C 56 56, 54 32, 50 10 Z" 
    fill="url(#trek-accent-grad)" 
    fill-opacity="0.18"
    stroke="url(#trek-accent-grad)" 
    stroke-width="3" 
    stroke-linejoin="round"
    filter="url(#trek-glow)"
  />

  <!-- Symbole de Code Web central : < / > -->
  <!-- Crochet gauche < -->
  <path 
    d="M 43 45 L 37 51 L 43 57" 
    stroke="var(--color-primary, #48e5c2)" 
    stroke-width="2.75" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Slash central / -->
  <path 
    d="M 47.5 61 L 52.5 41" 
    stroke="var(--color-text-white, #ffffff)" 
    stroke-width="2.5" 
    stroke-linecap="round" 
  />

  <!-- Crochet droit > -->
  <path 
    d="M 57 45 L 63 51 L 57 57" 
    stroke="var(--color-accent, #ffb703)" 
    stroke-width="2.75" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Étoile d'alignement au zénith (Apex Star) -->
  <circle cx="50" cy="10" r="2.2" fill="#ffffff" filter="url(#trek-glow)" />
</svg>
